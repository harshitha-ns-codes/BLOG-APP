<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Share Your Thoughts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>📝 BlogApp</h1>
            </div>
            <div class="nav-menu">
                <a href="#" onclick="showHome()" class="nav-link active">Home</a>
                <a href="#" onclick="showCreateBlog()" class="nav-link">Write</a>
                <div id="auth-buttons">
                    <button onclick="showLogin()" class="btn btn-outline">Login</button>
                    <button onclick="showRegister()" class="btn btn-primary">Sign Up</button>
                </div>
                <div id="user-menu" style="display: none;">
                    <span id="username-display"></span>
                    <button onclick="logout()" class="btn btn-outline">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- Home Page -->
        <div id="home-page" class="page">
            <div class="hero-section">
                <h2>Welcome to BlogApp</h2>
                <p>Share your thoughts, read amazing stories, and connect with the community</p>
            </div>

            <!-- Search and Filter -->
            <div class="search-filter-bar">
                <input type="text" id="search-input" placeholder="Search blogs..." class="search-input">
                <select id="sort-select" class="sort-select">
                    <option value="">Sort by</option>
                    <option value="popular">Most Popular</option>
                    <option value="recent">Most Recent</option>
                </select>
                <button onclick="loadBlogs()" class="btn btn-primary">Search</button>
            </div>

            <!-- Categories -->
            <div id="categories-section" class="categories-section"></div>

            <!-- Blogs List -->
            <div id="blogs-container" class="blogs-container"></div>

            <!-- Pagination -->
            <div id="pagination" class="pagination"></div>
        </div>

        <!-- Blog Detail Page -->
        <div id="blog-detail-page" class="page" style="display: none;">
            <button onclick="showHome()" class="btn btn-outline">← Back</button>
            <div id="blog-detail" class="blog-detail"></div>
            <div id="comments-section" class="comments-section"></div>
        </div>

        <!-- Create Blog Page -->
        <div id="create-blog-page" class="page" style="display: none;">
            <h2>Create New Blog</h2>
            <form id="create-blog-form" class="blog-form">
                <input type="text" id="blog-title" placeholder="Blog Title" required>
                <textarea id="blog-content" placeholder="Write your blog content here..." rows="15" required></textarea>
                <input type="text" id="blog-image" placeholder="Featured Image URL (optional)">
                <input type="text" id="blog-categories" placeholder="Categories (comma separated)">
                <button type="submit" class="btn btn-primary">Publish</button>
            </form>
        </div>

        <!-- Login Modal -->
        <div id="login-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="closeModal('login-modal')">&times;</span>
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
        </div>

        <!-- Register Modal -->
        <div id="register-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="closeModal('register-modal')">&times;</span>
                <h2>Sign Up</h2>
                <form id="register-form">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
